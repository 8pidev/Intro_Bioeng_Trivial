<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bioengineering Trivia</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <header>
        <p class="eyebrow">UC3M classroom game</p>
        <h1>Bioengineering Trivia</h1>
      </header>

      <section class="placeholder" aria-label="Board placeholder">
        <p>The interactive board will live here.</p>
      </section>

      <aside class="controls" aria-label="Game controls">
        <p><strong>Group 1</strong> starts the game.</p>
        <button id="roll-die" type="button">Roll die</button>
        <output id="die-result" aria-live="polite">-</output>
      </aside>
    </main>
    <script src="game.js"></script>
  </body>
</html>
